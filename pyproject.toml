[project]
name = "dspy-samples"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bnaveeng9", email = "naveeng9@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dspy-ai>=3.4.1",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
dspy-samples = "dspy_samples:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
